apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sdtd
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: sdtd
  source:
    repoURL: https://kubelize.github.io/game-servers/
    targetRevision: 0.1.0
    chart: game-servers
    helm:
      parameters: []
      valuesObject:
        replicaCount: 1
        image:
          repository: kubelize/game-servers
          pullPolicy: IfNotPresent
          tag: "0.2.9-sdtd"
        serverPasswordSecret:
          useExisting: false
          existingSecretName: ""
