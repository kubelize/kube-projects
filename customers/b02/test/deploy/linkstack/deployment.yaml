apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkstack
  labels:
    app: linkstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkstack
  template:
    metadata:
      labels:
        app: linkstack
    spec:
      containers:
       - name: linkstack
         image: nginx
         ports:
          - containerPort: 80
            name: http
         volumeMounts:
          - mountPath: usr/share/nginx/html
            name: linkstack-storage
         resources:
           limits:
             cpu: 1000m
             memory: 1Gi
           requests:
             cpu: 1000m
             memory: 1Gi 
      volumes:
       - name: linkstack-storage
         persistentVolumeClaim:
           claimName: linkstack-pvc