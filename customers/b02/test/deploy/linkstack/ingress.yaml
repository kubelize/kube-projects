apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linkstack-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod # Optional: for TLS
spec:
  ingressClassName: nginx
  rules:
    - host: www.example.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linkstack-service
                port:
                  number: 80
  tls:
    - hosts:
        - www.example.xyz
      secretName: linkstack-tls