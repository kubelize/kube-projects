- op: add
  path: "/spec/destination/namespace"
  value: b01-immich
- op: add
  path: "/spec/sources/0/helm"
  value:
    valueFiles:
      - $values/customers/b01/prod/values/postgresql/values.yaml
- op: add
  path: "/spec/sources/1/helm"
  value:
    valueFiles:
      - $values/customers/b01/prod/values/immich/values.yaml
- op: replace
  path: "/spec/sources/3"
  value:
    - repoURL: https://github.com/kubelize/kube-projects
      targetRevision: dev
      path: customers/b01/prod/deploy
