apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
  project: default
  destination:
    server: https://kubernetes.default.svc
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      path: postgresql
      targetRevision: 16.7.4
      chart: postgresql
    - repoURL: ghcr.io/immich-app/immich-charts
      targetRevision: 0.9.3
      chart: immich
    - repoURL: https://github.com/kubelize/kube-projects
      targetRevision: dev
      path: customers/example/stage/deploy
    - repoURL: https://github.com/kubelize/kube-projects
      targetRevision: dev
      ref: values