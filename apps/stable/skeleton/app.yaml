apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skeleton
  namespace: argocd
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
  project: default
  destination:
    server: https://kubernetes.default.svc
  sources:
    - repoURL: example
      path: example
      targetRevision: 1.1.1
      chart: example                         