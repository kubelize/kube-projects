apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: 

  # incubator
  - ../../../base/incubator/home-assistant/

  # stable
  - ../../../base/stable/gameservers/minecraft/atm9/
  - ../../../base/stable/gameservers/minecraft/vanilla/
  - ../../../customers/a01/

patches:
  - path: ./patches/vanilla-minecraft.yaml
    target:
      kind: Application
      name: vanilla-minecraft
  - path: ./patches/atm9-minecraft.yaml
    target:
      kind: Application
      name: atm9-minecraft
